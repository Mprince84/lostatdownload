                
                /<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DL26 Tent Seeker</title>
    <style>
        :root { --dl-green: #0f0; --dl-red: #f00; --dl-dark: #050505; }
        @keyframes pulse-green { 0% { box-shadow: inset 0 0 10px var(--dl-green); } 50% { box-shadow: inset 0 0 40px var(--dl-green); background: #0a1a0a; } 100% { box-shadow: inset 0 0 10px var(--dl-green); } }
        body { background: var(--dl-dark); color: var(--dl-green); font-family: 'Courier New', monospace; text-align: center; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: space-around; overflow: hidden; transition: background 0.3s; }
        #status { font-size: 9px; color: #333; letter-spacing: 3px; position: absolute; top: 10px; width: 100%; }
        h1 { font-size: 1.4rem; letter-spacing: -1px; text-transform: uppercase; margin: 0; text-shadow: 2px 2px var(--dl-red); color: #fff; }
        #compass { font-size: 100px; filter: drop-shadow(0 0 15px var(--dl-green)); display: block; margin: 0 auto; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #distance { font-size: 55px; font-weight: 900; margin: 0; color: #fff; text-shadow: 0 0 20px var(--dl-green); }
        #message { font-size: 14px; color: #888; letter-spacing: 1px; height: 20px; text-transform: uppercase; }
        .controls { padding: 0 30px; }
        .btn { padding: 18px; background: #000; color: var(--dl-green); border: 1px solid var(--dl-green); font-size: 14px; width: 100%; margin: 8px 0; border-radius: 2px; font-weight: bold; text-transform: uppercase; box-shadow: 4px 4px 0px var(--dl-red); cursor: pointer; }
        #flareBtn { border-color: var(--dl-red); color: var(--dl-red); box-shadow: 4px 4px 0px var(--dl-green); }
        .reset-link { color: #222; font-size: 11px; background: none; border: none; width: 100%; margin-top: 15px; text-decoration: underline; }
        .near-tent { animation: pulse-green 1.5s infinite; }
    </style>
</head>
<body>
    <div id="status">DOWNLOAD // DONINGTON PARK // 2026</div>
    <h1>TENT SEEKER</h1>
    
    <div id="compass">🤘</div>
    
    <div>
        <p id="distance">--- M</p>
        <p id="message">Awaiting coordinates...</p>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="saveTent()">LOCK TARGET</button>
        <button class="btn" id="flareBtn" onclick="toggleFlare()">EMERGENCY FLARE</button>
        <button class="reset-link" onclick="clearTent()">SYSTEM RESET</button>
    </div>

    <script>
        let tentLocation = JSON.parse(localStorage.getItem('tentPos'));
        const compass = document.getElementById('compass');
        const distEl = document.getElementById('distance');
        const msgEl = document.getElementById('message');
        let flareInterval = null;

        function saveTent() {
            navigator.geolocation.getCurrentPosition(pos => {
                tentLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                localStorage.setItem('tentPos', JSON.stringify(tentLocation));
                msgEl.innerText = "LOCATION SECURED";
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }, null, {enableHighAccuracy: true});
        }

        function clearTent() { localStorage.removeItem('tentPos'); tentLocation = null; location.reload(); }

        function toggleFlare() {
            if (flareInterval) { clearInterval(flareInterval); flareInterval = null; document.body.style.background = "#050505"; } 
            else { flareInterval = setInterval(() => { 
                document.body.style.background = document.body.style.background === "rgb(0, 255, 0)" ? "#fff" : "#0f0"; 
            }, 80); }
        }

        function update() {
            navigator.geolocation.getCurrentPosition(pos => {
                if (!tentLocation) return;
                const dLat = (tentLocation.lat - pos.coords.latitude) * 111139;
                const dLon = (tentLocation.lon - pos.coords.longitude) * 111139 * Math.cos(pos.coords.latitude * Math.PI / 180);
                const distance = Math.round(Math.sqrt(dLat*dLat + dLon*dLon));
                distEl.innerText = distance + "M";
                
                // Proximity Glow Activation
                if (distance < 30) document.body.classList.add('near-tent');
                else document.body.classList.remove('near-tent');

                if (distance > 200) msgEl.innerText = "IN THE WASTELAND";
                else if (distance > 20) msgEl.innerText = "APPROACHING CAMP";
                else { 
                    msgEl.innerText = "REACHED SANCTUARY"; 
                    if (navigator.vibrate && distance < 5) navigator.vibrate(50); 
                }

                const y = Math.sin((tentLocation.lon - pos.coords.longitude) * Math.PI / 180) * Math.cos(tentLocation.lat * Math.PI / 180);
                const x = Math.cos(pos.coords.latitude * Math.PI / 180) * Math.sin(tentLocation.lat * Math.PI / 180) - Math.sin(pos.coords.latitude * Math.PI / 180) * Math.cos(tentLocation.lat * Math.PI / 180) * Math.cos((tentLocation.lon - pos.coords.longitude) * Math.PI / 180);
                const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
                compass.style.transform = `rotate(${bearing}deg)`;
            }, null, {enableHighAccuracy: true});
        }
        setInterval(update, 2000);
    </script>
</body>
</html>
