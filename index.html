<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>TAC-NAV: OVERLORD</title>
    <style>
        :root { --os-green: #39ff14; --os-dim: #004400; --os-alert: #ff0000; --os-bg: #030303; }
        
        body { background: var(--os-bg); color: var(--os-green); font-family: 'Courier New', monospace; text-align: center; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-weight: 900; }
        
        /* Scanline Overlay */
        body::before { content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02)); z-index: 10; pointer-events: none; background-size: 100% 3px, 3px 100%; }

        header { padding: 15px 20px; font-size: 10px; border-bottom: 2px solid var(--os-dim); display: flex; justify-content: space-between; letter-spacing: 2px; }
        .pulse { animation: blink 1.5s infinite; color: var(--os-green); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        #main-hud { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }

        .reticle { width: 200px; height: 200px; border: 2px solid var(--os-dim); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
        .reticle-cross { position: absolute; width: 100%; height: 100%; }
        .reticle-cross::before { content: ""; position: absolute; top: 50%; left: -10%; width: 120%; height: 1px; background: var(--os-dim); }
        .reticle-cross::after { content: ""; position: absolute; left: 50%; top: -10%; height: 120%; width: 1px; background: var(--os-dim); }

        #arrow { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 40px solid var(--os-green); transition: transform 0.5s ease-out; filter: drop-shadow(0 0 10px var(--os-green)); z-index: 5; }

        #data-bank { margin-top: 20px; text-align: center; width: 280px; border: 1px solid var(--os-dim); padding: 15px; background: rgba(0,20,0,0.2); }
        #distance { font-size: 60px; margin: 0; color: #fff; text-shadow: 0 0 15px var(--os-green); line-height: 1; }
        #eta { font-size: 12px; color: var(--os-dim); margin-top: 5px; }

        .footer { padding: 20px 30px 50px 30px; background: #000; border-top: 2px solid var(--os-dim); }
        .btn { background: #000; border: 3px solid var(--os-green); color: var(--os-green); padding: 18px; width: 100%; font-family: inherit; font-size: 14px; margin-bottom: 12px; text-transform: uppercase; font-weight: 900; box-shadow: inset 0 0 5px var(--os-green); }
        #flareBtn { border-color: var(--os-alert); color: var(--os-alert); box-shadow: inset 0 0 5px var(--os-alert); }
    </style>
</head>
<body id="ui">
    <header>
        <span>STATUS: <span class="pulse">SCANNING</span></span>
        <span>MAG_NORTH: ACTIVE</span>
    </header>
    
    <div id="main-hud">
        <div class="reticle">
            <div class="reticle-cross"></div>
            <div id="arrow"></div>
        </div>
        
        <div id="data-bank">
            <div id="distance">-- M</div>
            <div id="eta">EST_TREK: -- MIN</div>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="saveTent()">LOCK TARGET</button>
        <button class="btn" id="flareBtn" onclick="toggleFlare()">SIGNAL FLARE</button>
        <div style="font-size: 9px; color: #1a1a1a; margin-top: 10px;">AUTH_REQUIRED // SESSION_2026</div>
    </div>

    <script>
        let tentLocation = JSON.parse(localStorage.getItem('tentPos'));
        const arrow = document.getElementById('arrow'), distEl = document.getElementById('distance'), etaEl = document.getElementById('eta'), ui = document.getElementById('ui');
        let flareInterval = null;

        function saveTent() {
            navigator.geolocation.getCurrentPosition(pos => {
                tentLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                localStorage.setItem('tentPos', JSON.stringify(tentLocation));
                if (navigator.vibrate) navigator.vibrate([40, 40]);
            }, null, {enableHighAccuracy: true});
        }

        function toggleFlare() {
            if (flareInterval) { clearInterval(flareInterval); flareInterval = null; ui.style.background = "#030303"; } 
            else { flareInterval = setInterval(() => { ui.style.background = ui.style.background === "rgb(0, 255, 0)" ? "#fff" : "#0f0"; }, 80); }
        }

        function update() {
            navigator.geolocation.getCurrentPosition(pos => {
                if (!tentLocation) return;
                const dLat = (tentLocation.lat - pos.coords.latitude) * 111139;
                const dLon = (tentLocation.lon - pos.coords.longitude) * 111139 * Math.cos(pos.coords.latitude * Math.PI / 180);
                const distance = Math.round(Math.sqrt(dLat*dLat + dLon*dLon));
                distEl.innerText = distance + " M";
                
                // ETA Logic
                const minutes = Math.round(distance / 84); // avg walk speed
                etaEl.innerText = `EST_TREK: ${minutes} MIN`;

                const y = Math.sin((tentLocation.lon - pos.coords.longitude) * Math.PI / 180) * Math.cos(tentLocation.lat * Math.PI / 180);
                const x = Math.cos(pos.coords.latitude * Math.PI / 180) * Math.sin(tentLocation.lat * Math.PI / 180) - Math.sin(pos.coords.latitude * Math.PI / 180) * Math.cos(tentLocation.lat * Math.PI / 180) * Math.cos((tentLocation.lon - pos.coords.longitude) * Math.PI / 180);
                arrow.style.transform = `rotate(${(Math.atan2(y, x) * 180 / Math.PI + 360) % 360}deg)`;
            }, null, {enableHighAccuracy: true});
        }
        setInterval(update, 2500);
    </script>
</body>
</html>
