<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tent Seeker</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: monospace; text-align: center; margin: 0; overflow: hidden; }
        #compass { font-size: 100px; margin-top: 50px; transition: transform 0.2s ease-out; }
        #distance { font-size: 24px; margin: 20px; font-weight: bold; }
        .btn { padding: 20px; background: #333; color: #00ff00; border: 2px solid #00ff00; font-size: 18px; cursor: pointer; width: 80%; margin: 10px; }
        #status { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <h1>TENT SEEKER v1.0</h1>
    <div id="status">Waiting for GPS...</div>
    <div id="compass">⬆️</div>
    <div id="distance">--- m</div>
    
    <button class="btn" onclick="saveTent()">DROP PIN AT TENT</button>
    <button class="btn" onclick="clearTent()">CLEAR LOCATION</button>

    <script>
        let tentLocation = JSON.parse(localStorage.getItem('tentPos'));
        const compass = document.getElementById('compass');
        const distEl = document.getElementById('distance');
        const statusEl = document.getElementById('status');

        function saveTent() {
            navigator.geolocation.getCurrentPosition(pos => {
                tentLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                localStorage.setItem('tentPos', JSON.stringify(tentLocation));
                alert("Location Locked. Sleep safe.");
            }, err => alert("GPS Error: " + err.message), {enableHighAccuracy: true});
        }

        function clearTent() {
            localStorage.removeItem('tentPos');
            tentLocation = null;
            distEl.innerText = "--- m";
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function update() {
            navigator.geolocation.getCurrentPosition(pos => {
                statusEl.innerText = "GPS Signal Active";
                if (!tentLocation) return;

                const currentLat = pos.coords.latitude;
                const currentLon = pos.coords.longitude;
                
                // Calculate distance (simplified for small festival area)
                const dLat = (tentLocation.lat - currentLat) * 111139;
                const dLon = (tentLocation.lon - currentLon) * 111139 * Math.cos(currentLat * Math.PI / 180);
                const distance = Math.sqrt(dLat*dLat + dLon*dLon).toFixed(1);
                
                distEl.innerText = distance + " METRES";

                // Direction logic (requires device orientation for full compass)
                const bearing = calculateBearing(currentLat, currentLon, tentLocation.lat, tentLocation.lon);
                compass.style.transform = `rotate(${bearing}deg)`;
            }, null, {enableHighAccuracy: true});
        }

        setInterval(update, 3000); // Pulse every 3 seconds to save battery
    </script>
</body>
</html>
